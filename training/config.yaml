# Graph CodeBERT Fine-Tuning Config
# Default: SmartBugs-Wild only (see training/run.sh --wild-only)

# Model
model_name: "microsoft/graphcodebert-base"
max_length: 512

# Data (train.py prefers training/data/combined.json when present)
manifest_path: "data/manifest.json"
augment: true
train_ratio: 0.7
val_ratio: 0.15
seed: 42

# Training - H100 optimized for ~5k wild samples
epochs: 20
batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 2e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# Output
output_dir: "training/checkpoints"
logging_steps: 10
eval_steps: 50
save_best: true
early_stopping_patience: 5

# Device
device: "auto"
